# TODO: add papers by configuration file
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "DoHeyYeah"
repo_name: "arXiV-favor"
show_authors: True
show_links: True
show_badge: False
max_results: 20

publish_readme: True
publish_gitpage: True
publish_wechat: False

# file paths
json_readme_path: './docs/cv-arxiv-daily.json'
json_gitpage_path: './docs/cv-arxiv-daily-web.json'
json_wechat_path: './docs/cv-arxiv-daily-wechat.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'
md_wechat_path: './docs/wechat.md'

# keywords to search
# 注意：每个 topic 内所有 filter 是 OR 关系，任何一个宽泛词都会放进大量噪声，
# 所以尽量用多词短语，不要用单词缩写（如 ICL）或泛词（如 benchmark、diffusion）
keywords:
    # --------- My Keywords ---------
    "Manipulation":
        filters: ["3D reconstruction", "NeRF", "MANO", "4D reconstruction", "flow matching", "dexterous manipulation", "robotic manipulation"]
    "Dexterous":
        filters: ["dexterous hand", "in-hand manipulation", "Human to Robot", "Human2Robot", "vision-based grasping"]
