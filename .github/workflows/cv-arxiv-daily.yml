name: Run Daily ArXiv Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"    # 每天 UTC 00:00 = 北京时间 8:00

env:
  GITHUB_USER_NAME: DoHeyYeah
  GITHUB_USER_EMAIL: your-email@example.com    # ← 改成你的邮箱
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.10
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run daily arxiv
      run: |
        python daily_arxiv.py --config config.yaml
        
    - name: Commit and push
      run: |
        git config --local user.email "$GITHUB_USER_EMAIL"
        git config --local user.name "$GITHUB_USER_NAME"
        git add -A
        git commit -m "daily update" || exit 0
        git push
