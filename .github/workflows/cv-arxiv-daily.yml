name: Run Daily ArXiv Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"    # 每天 UTC 00:00 = 北京时间 8:00

env:
  GITHUB_USER_NAME: DoHeyYeah
  GITHUB_USER_EMAIL: 2500013076@stu.pku.edu.cn

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run daily arxiv
      run: |
        python daily_arxiv.py --config_path config.yaml

    - name: Commit and push
      run: |
        git config --local user.email "$GITHUB_USER_EMAIL"
        git config --local user.name "$GITHUB_USER_NAME"
        git add README.md docs/
        git commit -m "Github Action Automatic Update CV Arxiv Papers" || exit 0
        git push
