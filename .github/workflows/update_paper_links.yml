name: Run Update Paper Links Weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"    # 每周一 UTC 08:00

env:
  GITHUB_USER_NAME: DoHeyYeah
  GITHUB_USER_EMAIL: 2500013076@stu.pku.edu.cn
  # 脚本会用这个 token 调 GitHub search API，避免匿名请求被限流
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  build:
    name: update
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Update paper links
      run: |
        python daily_arxiv.py --config_path config.yaml --update_paper_links

    - name: Commit and push
      run: |
        git config --local user.email "$GITHUB_USER_EMAIL"
        git config --local user.name "$GITHUB_USER_NAME"
        git add README.md docs/
        git commit -m "Github Action Automatic Update Paper Links" || exit 0
        git push
